apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-node
  template:
    metadata:
      labels:
        app: demo-node
    spec:
      containers:
      - name: demo-node
        image: demo-node:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
